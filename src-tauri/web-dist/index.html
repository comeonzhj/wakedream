<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>WakeDream — 正在启动</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    启动占位页（frontendDist）。真正的工作界面由边车提供（http://127.0.0.1:<port>/），
    Rust 侧等 /api/health 就绪后会把窗口导航过去。这一页只负责两件事：
      1) 让用户点开图标立刻看到东西（不是一片空白/转圈）；
      2) 启动失败时把原因显示出来（Rust 侧 set_title + eval 派发 wakedream:error 事件）。
    这页不调用任何 Tauri IPC，也不需要任何权限。
  -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #23232b;
      --panel: #2b2b34;
      --fg: #e8e8ee;
      --muted: #9a9aa8;
      --accent: #9b8cff;
      --danger: #ff8a8a;
      --hairline: rgba(255, 255, 255, 0.08);
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.6 var(--font-ui);
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
    }
    .card {
      width: min(520px, calc(100vw - 64px));
      padding: 28px 28px 22px;
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      text-align: center;
    }
    .mark { color: var(--accent); margin-bottom: 14px; }
    h1 { font-size: 17px; margin: 0 0 6px; font-weight: 600; letter-spacing: .01em; }
    p { margin: 0; color: var(--muted); font-size: 13px; }
    .spinner {
      width: 16px; height: 16px; margin: 16px auto 0;
      border: 2px solid rgba(155, 140, 255, .25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { display: none; text-align: left; }
    .error.is-on { display: block; }
    .error h1 { color: var(--danger); text-align: center; }
    .error pre {
      margin: 14px 0 0; padding: 12px;
      background: rgba(0, 0, 0, .28);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      font: 12px/1.55 var(--font-mono);
      color: #d9d9e3;
      white-space: pre-wrap; word-break: break-word;
      max-height: 220px; overflow: auto;
      -webkit-user-select: text; user-select: text;
    }
    .hint { display: none; margin-top: 14px; font-size: 12px; color: var(--muted); }
    .hint.is-on { display: block; }
    code { font: 12px var(--font-mono); color: var(--fg); }
    .idle .spinner { display: none; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        <path d="M3 20.5h18"/>
        <path d="M6.5 20.5a5.5 5.5 0 0 1 11 0"/>
      </svg>
    </div>

    <div id="loading">
      <h1>WakeDream</h1>
      <p>正在启动本地服务（会话索引 / 做梦引擎）…</p>
      <div class="spinner"></div>
      <div class="hint" id="slow-hint">
        比平时久一点。如果一直停在这一页，说明本地服务没起来——
        日志在 <code id="log-path">~/.wakedream/logs/desktop.log</code>。
      </div>
    </div>

    <div class="error" id="error">
      <h1>本地服务没能启动</h1>
      <p>桌面壳拉不起 <code>wakedream-server</code> 边车，或者它起来后马上退出了。</p>
      <pre id="error-text"></pre>
      <p style="margin-top:12px">
        完整日志：<code id="log-path-2">~/.wakedream/logs/desktop.log</code>
      </p>
    </div>
  </div>

  <script>
    // 启动失败：Rust 侧会 set_title + eval 派发这个事件
    window.addEventListener('wakedream:error', (ev) => {
      const message = (ev && ev.detail && ev.detail.message) || '未知错误';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').classList.add('is-on');
      document.getElementById('error-text').textContent = message;
    });

    // 兜底提示：20 秒还没被导航走，就把「可能卡住了」的话说出来（不假装还在忙）
    setTimeout(() => {
      const hint = document.getElementById('slow-hint');
      if (hint && !document.getElementById('error').classList.contains('is-on')) {
        hint.classList.add('is-on');
        document.getElementById('loading').classList.add('idle');
      }
    }, 20000);
  </script>
</body>
</html>
